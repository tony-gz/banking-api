server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1vbmx5LWZvci1sb2NhbC1wb3J0Zm9saW8tcmVwbGFjZS1pbi1wcm9k}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.tony.bankapi: INFO
  file:
    name: app.log
